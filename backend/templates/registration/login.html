<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign in — MDH Stoma Care Clinic</title>
  <style>
    :root{--teal:#005eb8;--teal-600:#00478f;--navy:#173b57;--gold:#007f86;--border:#d8e2e8;--muted:#5b6770;--ink:#263238;}
    *{box-sizing:border-box;}
    body{
      font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);margin:0;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:var(--navy);
      background-image:radial-gradient(1100px 500px at 50% -10%,rgba(0,94,184,.35),transparent 60%);
      padding:20px;
    }
    .card{background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);width:100%;max-width:380px;overflow:hidden;}
    .card .brand{background:var(--teal);color:#fff;padding:22px 26px;}
    .card .brand .logo{font-weight:800;font-size:19px;}
    .card .brand .logo span{color:#bcdcf5;}
    .card .brand .sub{font-size:12px;opacity:.9;margin-top:2px;}
    .card form{padding:24px 26px 26px;}
    label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:0 0 6px;}
    input[type=text],input[type=password]{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;margin-bottom:16px;}
    input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,94,184,.15);}
    .btn{width:100%;background:var(--teal);color:#fff;border:none;padding:12px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;}
    .btn:hover{background:var(--teal-600);}
    .err{background:#fbeaea;color:#c62828;border:1px solid #e6a2a2;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:16px;}
    .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:16px;}
    .foot a{color:var(--teal);text-decoration:none;}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">MDH <span>Stoma</span> Care</div>
      <div class="sub">Clinic management — sign in to continue</div>
    </div>
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="err">{{ form.non_field_errors|join:" " }}</div>
      {% elif form.errors %}
        <div class="err">Your username and password didn't match. Please try again.</div>
      {% endif %}

      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autofocus autocomplete="username" required/>

      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required/>

      <input type="hidden" name="next" value="{{ next }}"/>
      <button class="btn" type="submit">Sign in</button>

      <div class="foot">Administrator? <a href="/admin/">Open the admin site</a></div>
    </form>
  </div>
</body>
</html>
