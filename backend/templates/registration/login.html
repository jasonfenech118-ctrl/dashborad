{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign in — MDH Stoma Care Clinic</title>
  <style>
    :root{--teal:#cf1124;--teal-600:#a50e1d;--navy:#13294b;--gold:#38bdf8;--red:#dc2626;--border:#e2e8f0;--muted:#64748b;--ink:#0f172a;}
    *{box-sizing:border-box;}
    body{
      font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);margin:0;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      position:relative;isolation:isolate;padding:20px;
      background:var(--navy);
    }
    /* Fixed Malta harbour background with a soft white overlay for legibility. */
    body::before{
      content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
      background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),
        url("{% static 'images/app_background.png' %}") center center / cover no-repeat;
    }
    .card{background:rgba(255,255,255,.88);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
      border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);width:100%;max-width:380px;overflow:hidden;}
    .card .brand{background:var(--teal);color:#fff;padding:22px 26px;display:flex;align-items:center;gap:14px;}
    .card .brand .lock{
      width:44px;height:44px;flex:none;border-radius:11px;
      background:#fff;display:grid;place-items:center;
    }
    .card .brand .lock svg{width:24px;height:24px;stroke:var(--red);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
    .card .brand .logo{font-weight:800;font-size:19px;}
    .card .brand .logo span{color:#f6a5ab;}
    .card .brand .sub{font-size:12px;opacity:.9;margin-top:2px;}
    .card form{padding:24px 26px 26px;}
    label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:0 0 6px;}
    input[type=text],input[type=password]{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;margin-bottom:16px;}
    input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(207,17,36,.15);}
    .btn{width:100%;background:#89cff0;color:#0f2b3d;border:none;padding:12px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;}
    .btn:hover{background:#6fc0e8;}
    .err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:16px;}
    .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:16px;}
    .foot a{color:var(--teal);text-decoration:none;}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="lock" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1"/></svg>
      </span>
      <div>
        <div class="logo">MDH <span>Stoma</span> Care</div>
        <div class="sub">Clinic management — sign in to continue</div>
      </div>
    </div>
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="err">{{ form.non_field_errors|join:" " }}</div>
      {% elif form.errors %}
        <div class="err">Your username and password didn't match. Please try again.</div>
      {% endif %}

      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autofocus autocomplete="username" required/>

      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required/>

      <input type="hidden" name="next" value="{{ next }}"/>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
