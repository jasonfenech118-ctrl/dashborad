<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}MDH Stoma Care Clinic{% endblock %}</title>
  <style>
    :root{--teal:#0d7377;--navy:#1a2e4a;--navy2:#24406b;--gold:#e6a817;--border:#dbe7e6;--muted:#6b7a86;}
    *{box-sizing:border-box;}
    body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f4fbfa;color:var(--navy);margin:0;}
    /* App-shell top navigation (reference: Comarch-style ward EHR) */
    .topbar{
      background:var(--navy);
      background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 7px);
      color:#fff;padding:0 14px;display:flex;align-items:stretch;gap:2px;
      min-height:42px;box-shadow:0 1px 0 rgba(0,0,0,.25);
    }
    .topbar .logo{font-weight:800;display:flex;align-items:center;padding:0 14px 0 4px;white-space:nowrap;font-size:14px;}
    .topbar .logo span{color:var(--gold);}
    .topbar nav{display:flex;align-items:stretch;flex-wrap:wrap;}
    .topbar nav a{
      color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;opacity:.82;
      display:flex;align-items:center;padding:0 11px;white-space:nowrap;
      border-bottom:3px solid transparent;
    }
    .topbar nav a .car{opacity:.6;margin-left:4px;font-size:9px;}
    .topbar nav a:hover{opacity:1;background:var(--navy2);}
    .topbar nav a.active{opacity:1;border-bottom-color:var(--teal);background:var(--navy2);}
    .topbar nav a.dis{cursor:default;}
    .topbar nav a.dis:hover{background:transparent;opacity:.82;}
    .topbar .spacer{flex:1;}
    .topbar .util{display:flex;align-items:center;gap:6px;padding-left:8px;}
    .topbar .util .ic{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.85;text-decoration:none;color:#fff;}
    .topbar .util .ic:hover{background:var(--navy2);opacity:1;}
    .topbar .util .who{font-size:12px;opacity:.9;display:flex;align-items:center;gap:4px;}
    .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}
    h1{font-size:22px;margin:0 0 16px;}
    h2{font-size:16px;margin:24px 0 10px;color:var(--teal);}
    a{color:var(--teal);}
    table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
    th,td{text-align:left;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border);}
    th{background:#eef6f5;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:#f8fdfc;}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
    .controls input,.controls select{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;}
    .btn{background:var(--teal);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:700;cursor:pointer;text-decoration:none;font-size:13px;}
    .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eef6f5;color:var(--teal);}
    .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
    .kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
    .kv .v{font-weight:700;font-size:14px;}
    .muted{color:var(--muted);}
    .pager{margin-top:16px;display:flex;gap:8px;align-items:center;font-size:13px;}
    pre{white-space:pre-wrap;font-family:inherit;margin:0;font-size:12px;}
  </style>
</head>
<body>
  {% with vn=request.resolver_match.url_name %}
  <div class="topbar">
    <span class="logo">MDH <span>Stoma</span></span>
    <nav>
      <a class="dis" href="#" title="Coming soon">Intensive Ward <span class="car">▾</span></a>
      <a href="{% url 'clinic:ward' %}" class="{% if vn == 'ward' %}active{% endif %}">Ward</a>
      <a class="dis" href="#" title="Coming soon">Calendar</a>
      <a href="{% url 'clinic:patient_list' %}" class="{% if vn == 'patient_list' or vn == 'patient_detail' %}active{% endif %}">Patients</a>
      <a class="dis" href="#" title="Coming soon">Treatment rooms <span class="car">▾</span></a>
      <a class="dis" href="#" title="Coming soon">Tasks</a>
      <a href="{% url 'clinic:dashboard' %}" class="{% if vn == 'dashboard' %}active{% endif %}">Aggregate</a>
      <a class="dis" href="#" title="Coming soon">Reports</a>
      <a class="dis" href="#" title="Coming soon">Settlements <span class="car">▾</span></a>
      <a class="dis" href="#" title="Coming soon">Accounts <span class="car">▾</span></a>
      <a href="/admin/" title="Django admin">More <span class="car">▾</span></a>
    </nav>
    <span class="spacer"></span>
    <div class="util">
      <a class="ic" href="#" title="Messages">✉</a>
      {% if user.is_authenticated %}
        <span class="who">{{ user.username }} <span class="car">▾</span></span>
        <a class="ic" href="/admin/logout/" title="Sign out">⏻</a>
      {% else %}
        <a class="ic" href="/admin/login/" title="Sign in">⏻</a>
      {% endif %}
    </div>
  </div>
  {% endwith %}
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
