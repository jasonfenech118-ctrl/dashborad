{% autoescape on %}<!doctype html>
<html>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;color:#1a2233;">
  <div style="max-width:600px;margin:0 auto;padding:24px;">
    <div style="background:#fff;border:1px solid #d9e0ea;border-radius:8px;overflow:hidden;">
      <div style="background:#13294b;color:#fff;padding:16px 22px;">
        <div style="font-size:12px;letter-spacing:.5px;opacity:.85;">MDH STOMA CARE CLINIC · REMINDER</div>
        <div style="font-size:19px;font-weight:700;margin-top:4px;">{{ r.title }}</div>
      </div>
      <div style="padding:20px 22px;">
        {% if r.message %}<p style="font-size:14px;margin:0 0 16px;">{{ r.message }}</p>{% endif %}
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <tr><td style="padding:4px 0;color:#5b6b82;width:120px;">Schedule</td>
              <td style="padding:4px 0;font-weight:700;">{{ r.schedule_display }}</td></tr>
          <tr><td style="padding:4px 0;color:#5b6b82;">Date</td>
              <td style="padding:4px 0;">{{ today|date:"l, d/m/Y" }}</td></tr>
        </table>
        <p style="font-size:11px;color:#8a97a8;margin-top:20px;">Sent automatically by the MDH Stoma Care dashboard.</p>
      </div>
    </div>
  </div>
</body>
</html>{% endautoescape %}
