{% extends "clinic/base.html" %}
{% block title %}Registers — MDH Stoma Care Clinic{% endblock %}
{% block content %}
<style>
  .po-head p{margin:6px 0 0;color:var(--muted);font-size:13.5px;max-width:560px;}
  .po-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:22px;}
  .po-card{
    background:rgba(255,255,255,.88);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    border:1px solid var(--border);border-radius:12px;padding:20px 18px;
    display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    transition:border-color .12s ease,box-shadow .12s ease;min-height:72px;
  }
  .po-card:hover{border-color:var(--teal);box-shadow:0 4px 14px rgba(29,78,216,.12);}
  .po-ic{width:42px;height:42px;border-radius:10px;flex:none;display:grid;place-items:center;}
  .po-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
  .po-ic.teal{background:var(--teal-50);color:var(--teal);}
  .po-ic.amber{background:#fffbeb;color:#d97706;}
  .po-ic.muted{background:#f1f5f9;color:var(--navy);}
  .po-tx{flex:1;min-width:0;}
  .po-t{font-weight:700;font-size:14px;color:var(--navy);}
  .po-n{font-weight:800;font-size:22px;color:var(--navy);margin-top:2px;}
  .po-chev{color:#94a3b8;flex:none;}
  .po-card:hover .po-chev{color:var(--teal);}
  .po-card.soon{cursor:default;}
  .po-card.soon:hover{border-color:var(--border);box-shadow:none;}
  .po-card.soon .po-chev{display:none;}
  .po-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:#f1f5f9;color:var(--muted);}
</style>

<div class="po-head">
  <h1 style="margin-bottom:0;">Registers</h1>
  <p>Clinical registers and patient groupings.</p>
</div>

<div class="po-grid">
  <a class="po-card" href="{% url 'clinic:patient_list' %}?status=inpatient">
    <span class="po-ic teal">
      <svg viewBox="0 0 24 24"><path d="M3 20v-8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8"/><path d="M5 10V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4"/><path d="M3 18h18"/></svg>
    </span>
    <span class="po-tx">
      <span class="po-t">Inpatients</span>
      <span class="po-n">{{ stats.inpatient }}</span>
    </span>
    <span class="po-chev"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
  </a>

  <span class="po-card soon" title="Coming soon">
    <span class="po-ic muted">
      <svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
    </span>
    <span class="po-tx">
      <span class="po-t">Discharges (Post Operative)</span>
      <span class="po-badge">Coming soon</span>
    </span>
  </span>

  <span class="po-card soon" title="Coming soon">
    <span class="po-ic amber">
      <svg viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
    </span>
    <span class="po-tx">
      <span class="po-t">Temporary Paused</span>
      <span class="po-badge">Coming soon</span>
    </span>
  </span>
</div>
{% endblock %}
